<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Импульс — магазин электроники: наушники, смартфоны, часы, камеры и техника для работы. Доставка за 1–2 дня." />
    <meta name="theme-color" content="#07080A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Импульс — магазин электроники</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('impulse-theme') || '{}').state?.theme
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/entrypoint/main.tsx"></script>
  </body>
</html>
